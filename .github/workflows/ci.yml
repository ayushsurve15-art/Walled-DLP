name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and proxy integration tests
        run: pytest -q
      - name: Browser end-to-end tests (real Chrome routed through the real app)
        env:
          WALLED_PYTHON: python
        run: |
          google-chrome --version
          npm run test:e2e

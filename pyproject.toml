[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walled-dlp"
version = "2.0.0"
description = "Standalone desktop DLP app: inspects prompts and file uploads to ChatGPT and Perplexity for sensitive content before they leave the computer."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42",
  "pypdf>=4.0",
  "pillow>=10.0",
  "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
walled-dlp = "walled_dlp.cli:main"

[project.gui-scripts]
walled-dlp-app = "walled_dlp.app:main"

[tool.setuptools.packages.find]
include = ["walled_dlp*"]

[tool.setuptools.package-data]
"walled_dlp.assets" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
